  <!-- 사람 아이콘 (헤더) -->
  <circle cx="50" cy="35" r="6" fill="#3b82f6"/>
  <path d="M 42 47 Q 42 42 50 42 Q 58 42 58 47" fill="#3b82f6"/>
  
  <!-- 텍스트 라인들 -->
  <rect x="36" y="52" width="28" height="2.5" rx="1" fill="#3b82f6" opacity="0.7"/>
  <rect x="36" y="58" width="22" height="2.5" rx="1" fill="#3b82f6" opacity="0.5"/>
  <rect x="36" y="64" width="25" height="2.5" rx="1" fill="#3b82f6" opacity="0.5"/>
  <rect x="36" y="70" width="20" height="2.5" rx="1" fill="#3b82f6" opacity="0.5"/>
</svg>

